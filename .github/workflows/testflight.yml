name: TestFlight

# Every push to main that touches the iOS app (or anything it builds from)
# uploads a build to TestFlight. The internal group "Core" has automatic
# distribution enabled, so it reaches testers as soon as App Store Connect
# finishes processing.
#
# The pipeline itself lives in jonathans859/apple-ci, shared with every app on
# this Apple account: archive, export, upload, versioning and the one shared
# Apple Development certificate are defined once there rather than six times.
#
# No release trigger: this app has no external TestFlight group, so there is
# nothing for a release to promote. The macOS zip and the Windows agent are
# still attached to releases by their own workflows.

on:
  push:
    branches: [main]
    paths:
      # Deliberately no self-reference: a CI-only edit should not mint a
      # tester-visible build with no app change. Safe because the pipeline
      # itself lives in jonathans859/apple-ci and is exercised there.
      - 'apps/iOS/**'
      - 'BridgeCore/**'
      - 'project.yml'
  workflow_dispatch:

# One run at a time; a newer push cancels a superseded one. Parallel uploads
# against one app record race App Store Connect processing, and finishing a
# stale archive is billed macOS minutes for a build nobody will install.
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    uses: jonathans859/apple-ci/.github/workflows/testflight.yml@v1
    secrets: inherit
    with:
      platform: ios
      project: KeyBridge.xcodeproj
      scheme: KeyBridge-iOS
      app-id: "6791947815"
      xcodegen-spec: project.yml
      artifact-name: RemKeys-ipa
