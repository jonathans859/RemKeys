name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One macOS job, not two: macOS runners bill 10x and each job rounds up
  # separately. The iOS build is deliberately absent — every push to main
  # that touches iOS code triggers deploy-ios, which compiles the same code
  # against the real SDK minutes later; a simulator build here was redundant
  # spend. The macOS app build stays: it is the only compile check for
  # apps/macOS while its deploy workflow is disabled.
  apple:
    name: BridgeCore tests + build macOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run unit tests
        run: swift test
        working-directory: BridgeCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build macOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KeyBridge.xcodeproj \
            -scheme KeyBridge-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

  windows-agent:
    name: Build Windows agent
    # ubuntu, not windows: the .NET SDK cross-compiles the agent fine, and
    # Linux runners bill at 1x (Windows is 2x) and boot faster. Only
    # deploy-windows.yml, which actually ships the zip, stays on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build KeyBridgeAgent.csproj -c Release
        working-directory: windows-agent
