name: Deploy iOS

# Every push to main that touches the iOS app (or anything it builds from)
# uploads a build to TestFlight. An internal tester group with automatic
# distribution enabled receives it as soon as App Store Connect finishes
# processing — no group-assignment call needed. Also runs on Release publish
# so a Release always has a matching TestFlight build.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.

on:
  push:
    branches: [main]
    paths:
      - 'apps/iOS/**'
      - 'BridgeCore/**'
      - 'project.yml'
      - 'fastlane/**'
      - 'Gemfile'
      - '.github/workflows/deploy-ios.yml'
  release:
    types: [published]
  workflow_dispatch:

# Serialize uploads: parallel pilot runs against one app record race ASC
# processing. Queue, never cancel a run mid-upload.
concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  testflight:
    name: iOS → TestFlight (internal)
    # macos-26, not macos-15: App Store Connect enforces an SDK floor on
    # uploads (2026: iOS 26 SDK → Xcode 26), and macos-15 tops out at 16.4.
    # Only uploads have the floor — ci.yml's unsigned builds stay on 15.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # build number = git rev-list --count HEAD
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: Install gems
        run: bundle install
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Write API key to disk
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Becomes TestFlight's "What to Test" (raw text, not markdown).
          CHANGELOG: ${{ github.event_name == 'release' && github.event.release.body || github.event.head_commit.message }}
        run: bundle exec fastlane ios ios_beta
