name: Deploy Windows agent

# Every push to main that touches the agent produces a ready-to-run build
# (self-contained — .NET runtime bundled, no install prerequisites — plus
# install/uninstall scripts and appsettings.json) attached to the workflow run
# as an artifact, which downloads as one zip of loose files. On Release publish
# the same files go up as a single zip asset. No signing secrets.

on:
  push:
    branches: [main]
    paths:
      - 'windows-agent/**'
      - '.github/workflows/deploy-windows.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write   # attach the zip to a Release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version number is the commit count.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # 1.0.<commit count>, the same build-number rule the iOS/macOS lanes use:
      # monotonic on main, recomputable from any checkout, and comparable as a
      # plain integer. Only the number is passed — the SDK appends "+<commit>"
      # to InformationalVersion by itself from the checkout's git data. Both
      # show in the tray's About dialog and in the first line of the log.
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $build = git rev-list --count HEAD
          "version=1.0.$build" >> $env:GITHUB_OUTPUT
      - name: Publish
        working-directory: windows-agent
        run: >
          dotnet publish RemKeysAgent.csproj -c Release -r win-x64 --self-contained true -o publish
          -p:Version=${{ steps.version.outputs.version }}
      - name: Add the install scripts
        working-directory: windows-agent
        shell: pwsh
        run: Copy-Item install-agent.bat, uninstall-agent.bat, install-lockscreen.bat, uninstall-lockscreen.bat publish/
      # Upload the publish folder itself, NOT a zip of it: upload-artifact
      # already zips what it is given, so handing it a .zip produced a zip
      # nested inside the downloaded zip.
      - name: Attach the build to this run
        uses: actions/upload-artifact@v4
        with:
          name: RemKeysAgent-win-x64
          path: windows-agent/publish/*
          if-no-files-found: error
      # A Release asset does want to be one file, so that zip is built here
      # only, where it is actually the deliverable.
      - name: Zip for the Release
        if: github.event_name == 'release'
        working-directory: windows-agent
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RemKeysAgent-win-x64.zip
      - name: Attach zip to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: windows-agent/RemKeysAgent-win-x64.zip
