name: Deploy Windows agent

# Every push to main that touches the agent produces a ready-to-run zip
# (self-contained build — .NET runtime bundled, no install prerequisites —
# plus install/uninstall scripts and appsettings.json) attached to the
# workflow run as an artifact. On Release publish the same zip is also
# attached to the Release. No signing secrets.

on:
  push:
    branches: [main]
    paths:
      - 'windows-agent/**'
      - '.github/workflows/deploy-windows.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write   # attach the zip to a Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        working-directory: windows-agent
        run: dotnet publish KeyBridgeAgent.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Package
        working-directory: windows-agent
        shell: pwsh
        run: |
          Copy-Item install-agent.bat, uninstall-agent.bat publish/
          Compress-Archive -Path publish/* -DestinationPath KeyBridgeAgent-win-x64.zip
      - name: Attach zip to this run
        uses: actions/upload-artifact@v4
        with:
          name: KeyBridgeAgent-win-x64
          path: windows-agent/KeyBridgeAgent-win-x64.zip
          if-no-files-found: error
      - name: Attach zip to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: windows-agent/KeyBridgeAgent-win-x64.zip
