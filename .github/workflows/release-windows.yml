name: Release Windows agent

# Publishing a GitHub Release builds the standalone Windows agent and attaches
# a ready-to-run zip (framework-dependent build + install/uninstall scripts +
# appsettings.json). No app store, no signing secrets.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        working-directory: windows-agent
        run: dotnet publish KeyBridgeAgent.csproj -c Release -o publish
      - name: Package
        working-directory: windows-agent
        shell: pwsh
        run: |
          Copy-Item install-service.bat, uninstall-service.bat publish/
          Compress-Archive -Path publish/* -DestinationPath KeyBridgeAgent-win-x64.zip
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: windows-agent/KeyBridgeAgent-win-x64.zip
