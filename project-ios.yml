# XcodeGen spec for the iOS app ALONE, and the shared base of project.yml.
#
# TestFlight builds from this file (`xcodegen generate --spec project-ios.yml`)
# so the iOS build never resolves Sparkle, which only the Mac app links: a
# GitHub release-download outage (2026-11-08) failed every iOS archive at
# "Could not resolve package dependencies" for a package iOS doesn't use.
# project.yml includes this file and adds the Mac app; locally, keep running
# plain `xcodegen generate` for both.
#
# The shared settings stay HERE, literally: apple-ci reads MARKETING_VERSION by
# grepping the spec it is given, and does not follow includes.
#
# Naming: the product/brand name is **RemKeys** (the App Store name
# "KeyBridge" was taken); repo, targets, schemes, and the bundle id keep the
# internal KeyBridge name.
# XcodeGen manifest — the source of truth for the Xcode project.
# The .xcodeproj is NOT committed; CI (and you locally) run:
#     brew install xcodegen && xcodegen generate
# then open KeyBridge.xcodeproj. Info.plists are generated from the `info`
# blocks below, so no plist is hand-maintained.
#
# Naming: the product/brand name is **RemKeys** (the App Store name
# "KeyBridge" was taken); repo, targets, schemes, and the bundle id keep the
# internal KeyBridge name.
name: KeyBridge

options:
  bundleIdPrefix: com.jonathan859
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  BridgeCore:
    path: BridgeCore

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: "apple-generic"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"

targets:
  # ---------------------------------------------------------------- iOS app
  KeyBridge-iOS:
    type: application
    platform: iOS
    sources:
      - apps/iOS
    dependencies:
      - package: BridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan859.keybridge
        PRODUCT_NAME: RemKeys
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # iCloud key-value storage, for syncing the Virtual Input pads between
    # the user's devices (PadStore). iOS target only: the Mac app has no pads,
    # and an App-ID capability on the Mac target breaks its archive ("no
    # devices from which to generate a provisioning profile"). Generated, like
    # the Info.plist, so the file is not committed.
    entitlements:
      path: apps/iOS/RemKeys.generated.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: apps/iOS/Info.generated.plist
      properties:
        CFBundleDisplayName: RemKeys
        # Without these two the generated Info.plist carries a LITERAL 1.0/1:
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION are build settings, and
        # XcodeGen does not map them into the plist by itself, so the build number
        # increment_build_number writes never reaches the bundle and Xcode renumbers
        # sequentially at export (this app shipped '1.0 (63)' against a project
        # saying 1.0.0).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # All four orientations: ASC rejects iPad multitasking apps (90474)
        # unless PortraitUpsideDown is present too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

schemes:
  KeyBridge-iOS:
    build:
      targets:
        KeyBridge-iOS: all
    run:
      config: Debug
    archive:
      config: Release
