# XcodeGen manifest — the source of truth for the Xcode project.
# The .xcodeproj is NOT committed; CI (and you locally) run:
#     brew install xcodegen && xcodegen generate
# then open KeyBridge.xcodeproj. Info.plists are generated from the `info`
# blocks below, so no plist is hand-maintained.
#
# Naming: the product/brand name is **RemKeys** (the App Store name
# "KeyBridge" was taken); repo, targets, schemes, and the bundle id keep the
# internal KeyBridge name.
name: KeyBridge

options:
  bundleIdPrefix: com.jonathan859
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  BridgeCore:
    path: BridgeCore

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: "apple-generic"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"

targets:
  # ---------------------------------------------------------------- iOS app
  KeyBridge-iOS:
    type: application
    platform: iOS
    sources:
      - apps/iOS
    dependencies:
      - package: BridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan859.keybridge
        PRODUCT_NAME: RemKeys
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: apps/iOS/Info.generated.plist
      properties:
        CFBundleDisplayName: RemKeys
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  # -------------------------------------------------------------- macOS app
  # Menu-bar (LSUIElement) app. Installs a CGEventTap, so it CANNOT be
  # App-Sandboxed — distributed as Developer ID + notarized, not via the Mac
  # App Store / TestFlight. Hardened Runtime is on for notarization.
  KeyBridge-macOS:
    type: application
    platform: macOS
    sources:
      - apps/macOS
    dependencies:
      - package: BridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan859.keybridge
        PRODUCT_NAME: RemKeys
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: apps/macOS/Info.generated.plist
      properties:
        CFBundleDisplayName: RemKeys
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSInputMonitoringUsageDescription: "RemKeys reads the physical Caps Lock key so it can be forwarded as a held modifier to your Windows PC."
        ITSAppUsesNonExemptEncryption: false

schemes:
  KeyBridge-iOS:
    build:
      targets:
        KeyBridge-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  KeyBridge-macOS:
    build:
      targets:
        KeyBridge-macOS: all
    run:
      config: Debug
    archive:
      config: Release
