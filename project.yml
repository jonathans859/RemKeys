# XcodeGen manifest — the source of truth for the Xcode project, both apps.
# The .xcodeproj is NOT committed; CI (and you locally) run:
#     brew install xcodegen && xcodegen generate
# then open KeyBridge.xcodeproj. Info.plists are generated from the `info`
# blocks, so no plist is hand-maintained.
#
# Everything shared — name, options, settings, BridgeCore, the iOS target — is
# in project-ios.yml, which TestFlight builds from on its own; this file adds
# what only the Mac app needs. Edit the shared parts THERE.
include:
  - project-ios.yml

options:
  deploymentTarget:
    macOS: "14.0"

packages:
  # In-app updates for the macOS app (Developer ID builds can't use the App
  # Store's). Pinned exactly: deploy-macos.yml downloads sign_update from the
  # same Sparkle release, and the two should move together.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  # -------------------------------------------------------------- macOS app
  # Menu-bar (LSUIElement) app. Installs a CGEventTap, so it CANNOT be
  # App-Sandboxed — distributed as Developer ID + notarized, not via the Mac
  # App Store / TestFlight. Hardened Runtime is on for notarization.
  KeyBridge-macOS:
    type: application
    platform: macOS
    sources:
      - apps/macOS
    dependencies:
      - package: BridgeCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan859.keybridge
        PRODUCT_NAME: RemKeys
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: apps/macOS/Info.generated.plist
      properties:
        CFBundleDisplayName: RemKeys
        # Without these two the generated Info.plist carries a LITERAL 1.0/1:
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION are build settings, and
        # XcodeGen does not map them into the plist by itself, so the build number
        # increment_build_number writes never reaches the bundle and Xcode renumbers
        # sequentially at export (this app shipped '1.0 (63)' against a project
        # saying 1.0.0).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSInputMonitoringUsageDescription: "RemKeys reads the physical Caps Lock key so it can be forwarded as a held modifier to your Windows PC."
        # Sparkle. The feed is a fixed asset on the rolling `macos-updates`
        # prerelease, which deploy-macos.yml rewrites on every Mac build — not
        # `releases/latest`, which a Windows-agent release would take over.
        SUFeedURL: https://github.com/jonathans859/RemKeys/releases/download/macos-updates/appcast.xml
        # Public half of the EdDSA key that signs each update; the private half
        # is the SPARKLE_ED_PRIVATE_KEY secret. Changing this strands every
        # installed copy (they only accept updates signed by this key).
        SUPublicEDKey: g1XqyQZU+Flnkxrepr7D0PjvXooalaGHc6sTa+IYeMk=
        # Check daily without Sparkle's "check automatically?" prompt...
        SUEnableAutomaticChecks: true
        # ...but never install unasked: an update relaunches the app, which
        # ends a forwarding session. Also hides the "install automatically"
        # checkbox from the update dialog.
        SUAllowsAutomaticUpdates: false
        ITSAppUsesNonExemptEncryption: false

schemes:
  KeyBridge-macOS:
    build:
      targets:
        KeyBridge-macOS: all
    run:
      config: Debug
    archive:
      config: Release
